<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#05080d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TrungKien ADAS">
  <title>TrungKien Web V1</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app">
    <video id="camera" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <header class="topbar">
      <div class="brand"><strong>TRUNGKIEN</strong><span>WEB V1 · UFLD CULANE</span></div>
      <div id="systemState" class="pill warn">CHƯA KHỞI ĐỘNG</div>
    </header>
    <section class="metrics">
      <div class="metric"><span>MODEL</span><strong id="modelState">—</strong></div>
      <div class="metric"><span>LANE</span><strong id="laneState">—</strong></div>
      <div class="metric"><span>AI</span><strong id="aiState">— ms</strong></div>
    </section>
    <section id="messagePanel" class="message-panel">
      <strong id="mainMessage">Bấm BẮT ĐẦU để mở camera</strong>
      <span id="subMessage">Lần đầu model khoảng 170 MB sẽ tải qua mạng.</span>
    </section>
    <section id="settingsPanel" class="settings hidden">
      <div class="setting-row">
        <label for="roiSlider">Vùng đường <span id="roiValue">60%</span></label>
        <input id="roiSlider" type="range" min="45" max="75" step="1" value="60">
      </div>
      <div class="setting-row">
        <label for="smoothSlider">Làm mượt <span id="smoothValue">65%</span></label>
        <input id="smoothSlider" type="range" min="30" max="90" step="5" value="65">
      </div>
      <p>Vùng đường kéo xuống nếu lane bị bắt quá cao; kéo lên nếu chỉ thấy phần sát đầu xe.</p>
    </section>
    <nav class="controls">
      <button id="startButton" class="primary">BẮT ĐẦU</button>
      <button id="centerButton" disabled>CÂN GIỮA</button>
      <button id="soundButton">ÂM THANH: BẬT</button>
      <button id="settingsButton">CHỈNH</button>
    </nav>
    <canvas id="modelCanvas" width="800" height="288" hidden></canvas>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/ort.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>

name: TrungKien Clean V1.4 Auto

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "clean-vehicle-android/**"
      - ".github/workflows/clean-vehicle.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Download models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clean-vehicle-android/app/src/main/assets /tmp/ufld

          curl -L --fail --retry 5 \
            "https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_tiny.onnx" \
            -o clean-vehicle-android/app/src/main/assets/yolox_tiny.onnx

          curl -L --fail --retry 5 \
            "https://s3.ap-northeast-2.wasabisys.com/pinto-model-zoo/140_Ultra-Fast-Lane-Detection/resources_culane.tar.gz" \
            -o /tmp/ufld.tar.gz

          tar -xzf /tmp/ufld.tar.gz -C /tmp/ufld

          cp \
            /tmp/ufld/saved_model_culane/ultra_falst_lane_detection_culane_288x800.onnx \
            clean-vehicle-android/app/src/main/assets/ufld_culane.onnx

          test "$(stat -c%s clean-vehicle-android/app/src/main/assets/ufld_culane.onnx)" = "178076232"

      - name: Build V1.4
        working-directory: clean-vehicle-android
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Prepare APK
        run: |
          cp \
            "clean-vehicle-android/app/build/outputs/apk/debug/app-debug.apk" \
            "clean-vehicle-android/app/build/outputs/apk/debug/TRUNGKIEN V1.4 AUTO.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TrungKien-Clean-V1.4-Auto
          path: "clean-vehicle-android/app/build/outputs/apk/debug/TRUNGKIEN V1.4 AUTO.apk"

name: TrungKien Clean V1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "clean-vehicle-android/**"
      - ".github/workflows/clean-vehicle.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Download official YOLOX-Tiny ONNX
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p clean-vehicle-android/app/src/main/assets

          curl -L --fail --retry 5 --connect-timeout 30 \
            "https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_tiny.onnx" \
            -o clean-vehicle-android/app/src/main/assets/yolox_tiny.onnx

          SIZE="$(stat -c%s clean-vehicle-android/app/src/main/assets/yolox_tiny.onnx)"
          test "$SIZE" -gt 5000000
          test "$SIZE" -lt 50000000

          echo "YOLOX-Tiny size: $SIZE bytes"
          sha256sum clean-vehicle-android/app/src/main/assets/yolox_tiny.onnx

      - name: Verify ONNX contract before Android build
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --quiet "onnxruntime==1.23.2" "numpy<3"

          python - <<'PY'
          import numpy as np
          import onnxruntime as ort

          path = "clean-vehicle-android/app/src/main/assets/yolox_tiny.onnx"
          s = ort.InferenceSession(path, providers=["CPUExecutionProvider"])

          print("INPUTS:")
          for i in s.get_inputs():
              print(i.name, i.shape, i.type)

          print("OUTPUTS:")
          for o in s.get_outputs():
              print(o.name, o.shape, o.type)

          inp = s.get_inputs()[0]
          shape = list(inp.shape)

          assert shape == [1, 3, 416, 416], f"Unexpected input shape: {shape}"

          x = np.zeros((1, 3, 416, 416), dtype=np.float32)
          y = s.run(None, {inp.name: x})[0]

          print("TEST OUTPUT:", y.shape, y.dtype)

          assert y.shape == (1, 3549, 85), f"Unexpected output shape: {y.shape}"
          assert np.isfinite(y).all(), "Model returned non-finite values"

          print("PASS: YOLOX-Tiny model contract verified.")
          PY

      - name: Build clean APK
        working-directory: clean-vehicle-android
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify model embedded
        shell: bash
        run: |
          set -euo pipefail

          APK="clean-vehicle-android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          unzip -p "$APK" assets/yolox_tiny.onnx > /tmp/model_from_apk.onnx

          cmp -s \
            clean-vehicle-android/app/src/main/assets/yolox_tiny.onnx \
            /tmp/model_from_apk.onnx

          echo "PASS: exact YOLOX-Tiny model embedded in CLEAN V1."

          cp \
            "$APK" \
            "clean-vehicle-android/app/build/outputs/apk/debug/TRUNGKIEN CLEAN V1.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TrungKien-Clean-V1
          path: "clean-vehicle-android/app/build/outputs/apk/debug/TRUNGKIEN CLEAN V1.apk"

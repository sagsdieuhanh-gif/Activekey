name: TrungKien V1 Road Core Stability Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Stage TrungKien V1 exact SAME FP32 UFLD CULane model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ufld app/offline_models
          curl -L --retry 3 --connect-timeout 30 \
            "https://s3.ap-northeast-2.wasabisys.com/pinto-model-zoo/140_Ultra-Fast-Lane-Detection/resources_culane.tar.gz" \
            -o /tmp/ufld.tar.gz
          tar -xzf /tmp/ufld.tar.gz -C /tmp/ufld
          MODEL="/tmp/ufld/saved_model_culane/ultra_falst_lane_detection_culane_288x800.onnx"
          test -f "$MODEL"
          cp "$MODEL" app/offline_models/lane_core.dat

          test "$(stat -c%s app/offline_models/lane_core.dat)" = "178076232"
          echo "3b86cf67c0de36af8e8e793317c3475978ecb4c6395c4292d0bd51d3ada53491  app/offline_models/lane_core.dat" | sha256sum -c -

          echo "Dedicated lane model VERIFIED: $MODEL ($(du -h app/offline_models/lane_core.dat | cut -f1))"
      - name: Build TrungKien V1 ARM64 APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify Lane Core inside APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"

          unzip -p "$APK" assets/lane_core.dat > /tmp/lane_core_from_apk.dat
          test "$(stat -c%s /tmp/lane_core_from_apk.dat)" = "178076232"
          echo "3b86cf67c0de36af8e8e793317c3475978ecb4c6395c4292d0bd51d3ada53491  /tmp/lane_core_from_apk.dat" | sha256sum -c -

          echo "PASS: exact FP32 Lane Core is physically inside the APK."
      - name: Prepare stable APK filename
        run: |
          cp "app/build/outputs/apk/debug/app-debug.apk" "app/build/outputs/apk/debug/TrungKien V1.apk"
          ls -lh "app/build/outputs/apk/debug/TrungKien V1.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TrungKien-V1
          path: "app/build/outputs/apk/debug/TrungKien V1.apk"
